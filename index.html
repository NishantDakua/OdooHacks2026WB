<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentEase – Razorpay Test</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f7fbfb; }
    #rzp-button1 { padding: 14px 36px; font-size: 16px; border: none; border-radius: 12px; background: #4f8c89; color: #fff; cursor: pointer; }
    #rzp-button1:hover { background: #3e7370; }
    #status { margin-top: 16px; color: #555; }
  </style>
</head>
<body>
  <div style="text-align:center">
    <h2>RentEase – Razorpay Standalone Test</h2>
    <p>Click below to create an order via the backend and open checkout.</p>
    <button id="rzp-button1">Pay ₹5.00</button>
    <p id="status"></p>
  </div>

  <script>
    const API_BASE = "http://localhost:5000";
    const KEY_ID   = "rzp_test_TNF744FIZN9GaR";
    const statusEl = document.getElementById("status");

    document.getElementById("rzp-button1").addEventListener("click", async (e) => {
      e.preventDefault();
      statusEl.textContent = "Creating order…";

      try {
        // Step 1 – create order on the backend
        const res = await fetch(`${API_BASE}/api/v1/payments/create-order`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: 500, currency: "INR", receipt: `test-${Date.now()}` }),
        });

        const result = await res.json();
        if (!res.ok || !result.success) throw new Error(result.message || "Order creation failed");

        statusEl.textContent = "Order created – opening checkout…";

        // Step 2 – open Razorpay checkout with the live order_id
        const rzp = new Razorpay({
          key: result.data.key_id || KEY_ID,
          amount: result.data.amount,
          currency: result.data.currency,
          order_id: result.data.order_id,
          name: "RentEase",
          description: "Test Transaction",
          handler: async (paymentResponse) => {
            statusEl.textContent = "Verifying payment…";
            try {
              const vRes = await fetch(`${API_BASE}/api/v1/payments/verify-payment`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  razorpay_payment_id: paymentResponse.razorpay_payment_id,
                  razorpay_order_id:   paymentResponse.razorpay_order_id,
                  razorpay_signature:  paymentResponse.razorpay_signature,
                }),
              });
              const vResult = await vRes.json();
              statusEl.textContent = vResult.success
                ? `✅ Payment verified! (${paymentResponse.razorpay_payment_id})`
                : `❌ Verification failed: ${vResult.message}`;
            } catch (err) {
              statusEl.textContent = `❌ Verification error: ${err.message}`;
            }
          },
          modal: { ondismiss: () => { statusEl.textContent = "Payment cancelled."; } },
          theme: { color: "#4f8c89" },
        });

        rzp.on("payment.failed", (ev) => {
          statusEl.textContent = `❌ Payment failed: ${ev?.error?.description || "Unknown error"}`;
        });

        rzp.open();
      } catch (err) {
        statusEl.textContent = `❌ ${err.message}`;
      }
    });
  </script>
</body>
</html>
